name: mental_health_app
description: A gamified mental health wellness app for students
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  
  # Backend connection
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  
  # Navigation
  go_router: ^14.0.0
  
  # Date & Time
  intl: ^0.19.0
  
  # Animations
  flutter_animate: ^4.3.0
  
  # Charts (for stats screen)
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # If you have assets, add them here:
  # assets:
  #   - assets/images/
  #   - assets/icons/